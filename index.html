<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کارت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{background:var(--bg,#fff)}
body{font-family:var(--fo,Vazirmatn),Vazirmatn,Tahoma,sans-serif;background:var(--bgi,var(--bg,#fff));min-height:100vh;min-height:100dvh;display:flex;padding-top:var(--st,0px);transition:background .3s}
#app{position:relative;margin:auto;min-height:160cqw;width:min(100vw,calc((100vh - var(--st,0px))*.52),560px);width:min(100vw,calc((100dvh - var(--st,0px))*.52),560px);container-type:inline-size;text-align:center}
#frame{position:absolute;left:0;right:0;top:11cqw;bottom:0;border:solid transparent;border-width:30cqw 15cqw;border-image-source:var(--fr,none);border-image-slice:16.9% 15%;border-image-repeat:stretch;mix-blend-mode:multiply;pointer-events:none}
[data-theme=dark] #frame,[data-theme=dark] .div{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}
[data-theme=dark] #title{filter:brightness(0) invert(1);opacity:.93}
#c{position:relative;display:flex;flex-direction:column;align-items:center;padding:27cqw 0 31cqw}
#logo{width:15.5cqw}
#title{width:56cqw;margin-top:4cqw}
.div{width:34cqw;mix-blend-mode:multiply;margin-top:1.4cqw}
.grid{display:grid;justify-content:center}
.g-top{grid-template-columns:repeat(2,33.5cqw);gap:4.5cqw}.g-top.one{grid-template-columns:33.5cqw}
.g-main{grid-template-columns:repeat(2,28.1cqw);gap:3.8cqw 9.7cqw;margin-top:4cqw}.g-main.one{grid-template-columns:28.1cqw}
.b{display:flex;align-items:center;justify-content:center;aspect-ratio:760/257;background:var(--btn,#2e4a62) var(--orn) center/100% 100% no-repeat;border-radius:1.8cqw;color:var(--tc,#fff);font-family:var(--fb,Vazirmatn),Vazirmatn,Tahoma,sans-serif;font-weight:800;text-decoration:none;overflow:hidden;white-space:nowrap;transition:transform .15s,filter .15s;box-shadow:0 .8cqw 2cqw -1cqw rgba(0,0,0,.45)}
.g-top .b{font-size:5.9cqw}.g-main .b{font-size:4.3cqw}
.b:hover{filter:brightness(1.12)}.b:active{transform:scale(.96)}.b:focus-visible{outline:3px solid #6a9ac4;outline-offset:2px}
.b.off{pointer-events:none}
#mt{margin-top:20cqw;padding:0 10cqw;font-size:5cqw;color:var(--tc2,#1b3a87);font-weight:700}
#top{position:absolute;top:0;left:0;right:0;height:11cqw;z-index:2}
#tg{position:absolute;top:1cqw;left:4cqw;width:9cqw;height:9cqw;border-radius:50%;border:1px solid rgba(128,128,128,.4);background:rgba(255,255,255,.65);color:#2e4a62;display:none;place-items:center;cursor:pointer;padding:0}#tg svg{width:4.8cqw;height:4.8cqw}
[data-theme=dark] #tg{background:rgba(20,32,44,.7);color:#e8c66a}
@media(min-width:700px){body{background:color-mix(in srgb,var(--bg) 90%,#587a96)}#app{background:var(--bgi,var(--bg));border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(10,30,50,.5)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"><div id="top"><button id="tg" aria-label="تغییر تم"></button></div><div id="frame"></div><div id="c"></div></div>
<script>
const $=s=>document.querySelector(s),R=document.documentElement;
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const GF=['Vazirmatn','Noto Naskh Arabic','Noto Sans Arabic','Amiri','Cairo','Tajawal','Lalezar','El Messiri'];
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
let D,PT=null;
function cur(){const t=PT||ls('th')||D.settings.theme||'auto';return t=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t}
function fit(){document.querySelectorAll('.b span').forEach(s=>{s.style.fontSize='';const p=s.parentElement;let f=parseFloat(getComputedStyle(s).fontSize);while(s.getBoundingClientRect().width>p.clientWidth*.82&&f>7){f-=.5;s.style.fontSize=f+'px'}})}
function fonts(d){const f=d.fonts||{},css=(f.custom||[]).map(x=>`@font-face{font-family:"${x.name}";src:url("${x.file}");font-display:swap}`).join('');
 let st=$('#ff');if(!st){st=document.createElement('style');st.id='ff';document.head.appendChild(st)}if(st.textContent!==css)st.textContent=css;
 [f.buttons,f.body].filter(n=>n&&GF.includes(n)).forEach(n=>{const id='gf-'+n.replace(/\W/g,'');if(!document.getElementById(id)){const l=document.createElement('link');l.id=id;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+n.replace(/ /g,'+')+':wght@400;700;800&display=swap';document.head.appendChild(l)}});
 R.style.setProperty('--fb',f.buttons?`"${f.buttons}"`:'Vazirmatn');R.style.setProperty('--fo',f.body?`"${f.body}"`:'Vazirmatn');
 [f.buttons,f.body].filter(Boolean).forEach(n=>document.fonts.load(`800 16px "${n}"`).then(fit).catch(()=>{}))}
function render(d){D=d;const s=d.settings,i=d.images,t=cur(),c=s[t]||{},e=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
 R.dataset.theme=t;const tg=$('#tg');tg.style.display=s.themeToggle?'grid':'none';tg.innerHTML=t=='dark'?SUN:MOON;try{if(parent!==window)parent.postMessage({type:'cardTheme',theme:t},'*')}catch(e){}
 R.style.setProperty('--bg',c.bg);R.style.setProperty('--bgi',c.bg2?`linear-gradient(180deg,${c.bg},${c.bg2})`:c.bg);R.style.setProperty('--btn',c.btn);R.style.setProperty('--tc',c.btnText);R.style.setProperty('--tc2',t=='dark'?'#dfe9f3':'#1b3a87');R.style.setProperty('--orn',`url(${i.ornament})`);
 fonts(d);document.title=s.pageTitle||'';R.style.setProperty('--fr',i.frame?`url(${i.frame})`:'none');$('#frame').style.display=s.showFrame&&i.frame?'block':'none';
  if(s.maintenance){$('#c').innerHTML=`<div id="mt">${e(s.maintenanceText)}</div>`;return}
 const btn=g=>{const l=d.buttons.filter(b=>b.group===g&&b.visible!==false);
  return l.length?`<div class="grid g-${g} ${l.length==1?'one':''}">`+l.map(b=>`<a class="b ${b.url?'':'off'}" ${b.url?`href="${e(b.url)}" ${s.newTab?'target="_blank" rel="noopener"':''}`:''}><span>${e(b.label)}</span></a>`).join('')+'</div>':''};
 const dv=s.showDivider&&i.divider?`<img class="div" src="${i.divider}" alt="">`:'';
 $('#c').innerHTML=(i.logo?`<img id="logo" src="${i.logo}" alt="">`:'')+(i.title?`<img id="title" src="${i.title}" alt="${e(s.pageTitle)}">`:'')+dv+btn('top')+dv+btn('main');
 fit();
}
document.addEventListener('click',e=>{if(e.target.closest('#tg')){ls('th',cur()=='dark'?'light':'dark');render(D)}});
addEventListener('message',m=>{if(m.data&&m.data.type==='preview'){PT=m.data.theme||null;if(m.data.safeTop!=null)R.style.setProperty('--st',m.data.safeTop+'px');render(m.data.data)}});
addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit);
fetch('data.json?'+Date.now()).then(r=>r.json()).then(render).catch(()=>$('#c').textContent='data.json پیدا نشد');
</script></body></html>
